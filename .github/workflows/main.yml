name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip User Project
        run: unzip cnmfox_mobile_final.zip -d original_project

      - name: Find Source Directory
        id: find-dir
        run: |
          DIR=$(find original_project -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'

      - name: Create Fresh Android Base
        run: flutter create --org com.cnmfox --project-name cnmfox_mobile app_build

      - name: Copy App Files
        run: |
          cp -r ${{ steps.find-dir.outputs.dir }}/lib app_build/
          if [ -d "${{ steps.find-dir.outputs.dir }}/assets" ]; then cp -r ${{ steps.find-dir.outputs.dir }}/assets app_build/; fi
          cp ${{ steps.find-dir.outputs.dir }}/pubspec.yaml app_build/

      - name: Fix Dart Syntax (withValues to withOpacity)
        run: |
          find app_build/lib -name "*.dart" -exec sed -i 's/withValues(alpha: /withOpacity(/g' {} +

      - name: Fix compileSdk to 35
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' app_build/android/app/build.gradle
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' app_build/android/app/build.gradle
          sed -i 's/targetSdkVersion 34/targetSdkVersion 35/g' app_build/android/app/build.gradle

      # ==========================================
      # ETAP ENPÒTAN: PÈMISYON ENTÈNÈT AK WHATSAPP
      # ==========================================
      - name: Ensure Permissions and Queries
        run: |
          MANIFEST="app_build/android/app/src/main/AndroidManifest.xml"
          
          # 1. Ajoute pèmisyon entènèt
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<manifest/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$MANIFEST"
          fi
          
          # 2. Ajoute règ pou louvri WhatsApp ak lòt lyen
          if ! grep -q "com.whatsapp" "$MANIFEST"; then
            sed -i 's/<application/<queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" \/>\n            <data android:scheme="https" \/>\n        <\/intent>\n        <package android:name="com.whatsapp" \/>\n        <package android:name="com.whatsapp.w4b" \/>\n    <\/queries>\n    <application/' "$MANIFEST"
          fi

      - name: Install dependencies
        working-directory: app_build
        run: flutter pub get

      - name: Generate Icons & Splash
        working-directory: app_build
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build APK
        working-directory: app_build
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cnmfox-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
